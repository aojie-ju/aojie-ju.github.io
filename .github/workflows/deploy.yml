name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub's own "pages build and deployment" (a Jekyll build of the branch) also runs on
      # every push, and the site shows whichever deploys last. On 2026-10-16 it finished
      # second and the site showed the README. Until Settings > Pages > Source is set to
      # "GitHub Actions", wait so this export always deploys after it.
      - name: Let the branch build finish first
        run: sleep 150

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
